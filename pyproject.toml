[project]
name = "gpt2-lecture"
version = "0.1.0"
description = "Following along with Andrej Karpathy's 'Let's reproduce GPT-2 (124M)'"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "tiktoken",
    "transformers",
    "triton-windows>=3.9.0.post30 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true