[project]
name = "gpt2-lecture"
version = "0.1.0"
description = "Following along with Andrej Karpathy's 'Let's reproduce GPT-2 (124M)'"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "tiktoken",
    "transformers",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
